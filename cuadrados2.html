<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Herencia</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: #D9D9D9;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        /* =================================================
           CONTENEDOR PRINCIPAL
        ================================================= */

        #juego {

            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto 0 auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* =================================================
           CANVAS
        ================================================= */

        #canvas {

            width: 100%;
            height: 100%;

            display: block;

            touch-action: none;

            cursor: pointer;
        }


        /* =================================================
           NAVEGACIÓN
        ================================================= */

        #navegacion {

            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 20;

            pointer-events: none;
        }


        /* =================================================
           FLECHAS
        ================================================= */

        .flecha {

            color: #C4CEE5;

            font-size: 38px;

            font-weight: 200;

            line-height: 1;

            cursor: pointer;

            pointer-events: auto;

            user-select: none;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        .flecha:hover {

            opacity: 0.7;

            transform: scale(1.1);
        }


        /* =================================================
           PROGRESO
        ================================================= */

        #progreso {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;
        }


        .circulo {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            opacity: 0.45;
        }


        .circulo.activo {

            background: #C4CEE5;

            opacity: 1;
        }

    </style>

</head>


<body>

    <main id="juego">


        <!-- =================================================
             CANVAS DEL JUEGO
        ================================================= -->

        <canvas id="canvas"></canvas>


        <!-- =================================================
             NAVEGACIÓN
        ================================================= -->

        <div id="navegacion">


            <!-- ANTERIOR -->

            <div
                class="flecha"
                onclick="window.location.href='cuadrados.html'"
            >
                ‹
            </div>


            <!-- PROGRESO -->

            <div id="progreso">

                <div class="circulo"></div>

                <div class="circulo activo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

            </div>


            <!-- SIGUIENTE -->

            <div
                class="flecha"
                onclick="window.location.href='cuadrados3.html'"
            >
                ›
            </div>


        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script src="cuadrados2.js"></script>

</body>

</html>
