
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Herencia</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           HTML Y BODY
        ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           CUERPO
        ===================================================== */

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           ÁREA PRINCIPAL DEL JUEGO
           EXACTAMENTE IGUAL A MEMORIA
        ===================================================== */

        #juego {

            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        #canvas {

            width: 100%;
            height: 100%;

            display: block;

            touch-action: none;

            cursor: pointer;
        }


        /* =====================================================
           NAVEGACIÓN
           EXACTAMENTE IGUAL A MEMORIA
        ===================================================== */

        #navegacion {

            position: absolute;

            top: 18px;

            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 1000;

            pointer-events: none;
        }


        /* =====================================================
           PROGRESO
           EXACTAMENTE IGUAL A MEMORIA
        ===================================================== */

        #progreso {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        /* =====================================================
           CÍRCULOS
           EXACTAMENTE IGUAL A MEMORIA
        ===================================================== */

        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* =====================================================
           CÍRCULO ACTIVO
           HERENCIA = CÍRCULO 2
        ===================================================== */

        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =====================================================
           FLECHAS
           EXACTAMENTE IGUAL A MEMORIA
        ===================================================== */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 32px;

            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            pointer-events: auto;

            position: relative;

            z-index: 1001;
        }


        /* =====================================================
           EFECTO AL PASAR EL MOUSE
           IGUAL A MEMORIA
        ===================================================== */

        #navegacion button:hover {

            opacity: 0.6;
        }


        /* =====================================================
           EFECTO AL PRESIONAR
           IGUAL A MEMORIA
        ===================================================== */

        #navegacion button:active {

            opacity: 0.4;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         ÁREA PRINCIPAL
    ===================================================== -->

    <main id="juego">


        <!-- =================================================
             NAVEGACIÓN
             EXACTAMENTE IGUAL A MEMORIA
        ================================================== -->

        <div id="navegacion">


            <!-- =============================================
                 FLECHA IZQUIERDA
                 Vuelve a MEMORIA
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='cuadrados.html'"
                aria-label="Volver a Memoria">

                ‹

            </button>


            <!-- =============================================
                 PROGRESO
                 9 EXPERIENCIAS
            ============================================== -->

            <div id="progreso">

                <!-- 1 - MEMORIA -->
                <span></span>

                <!-- 2 - HERENCIA -->
                <span class="activo"></span>

                <!-- 3 - CADUCIDAD -->
                <span></span>

                <!-- 4 - IDENTIDAD -->
                <span></span>

                <!-- 5 - EMPATÍA -->
                <span></span>

                <!-- 6 - COLABORACIÓN -->
                <span></span>

                <!-- 7 - INCERTIDUMBRE -->
                <span></span>

                <!-- 8 - DESPRENDIMIENTO -->
                <span></span>

                <!-- 9 - EXPECTATIVA -->
                <span></span>

            </div>


            <!-- =============================================
                 FLECHA DERECHA
                 Avanza a CADUCIDAD
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='cuadrados3.html'"
                aria-label="Avanzar a Caducidad">

                ›

            </button>


        </div>


        <!-- =================================================
             CANVAS DE HERENCIA
        ================================================== -->

        <canvas id="canvas"></canvas>


    </main>


    <!-- =====================================================
         JAVASCRIPT DE HERENCIA
         NO SE MODIFICA
    ===================================================== -->

    <script src="cuadrados2.js"></script>


</body>

</html>
