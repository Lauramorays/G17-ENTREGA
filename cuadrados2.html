<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Herencia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;
            background: #060C1A;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>

    <main id="juego">
        <canvas id="canvas"></canvas>
    </main>

    <script src="cuadrados2.js"></script>

</body>
</html>
