
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Herencia</title>

    <style>

        /* Configuración general */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        /* Fondo exterior */
        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Área principal del juego */
        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto 0 auto;
            background: #060C1A;
            position: relative;
            overflow: hidden;
        }

        /* Canvas donde funciona el juego */
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: pointer;
        }

        /* Barra de navegación superior */
        #navegacion {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            width: 94%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            z-index: 1000;

            /* Permite que solo las flechas reciban el clic */
            pointer-events: none;
        }

        /* Flechas de navegación */
        .flecha {
            color: #C4CEE5;
            font-size: 38px;
            font-weight: 200;
            line-height: 1;

            cursor: pointer;
            user-select: none;

            /* Las flechas sí reciben el clic */
            pointer-events: auto;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        /* Efecto al pasar el mouse */
        .flecha:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

        /* Grupo de los 9 puntos */
        #progreso {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
        }

        /* Punto de progreso */
        .circulo {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            opacity: 0.45;
        }

        /* Segundo punto: pantalla actual */
        .circulo.activo {
            background: #C4CEE5;
            opacity: 1;
        }

    </style>

</head>


<body>

    <main id="juego">

        <!-- Área donde se ejecuta Herencia -->
        <canvas id="canvas"></canvas>


        <!-- Navegación entre las pantallas -->
        <div id="navegacion">

            <!-- Pantalla anterior -->
            <div
                class="flecha"
                onclick="window.location.href='cuadrados.html'"
            >
                ‹
            </div>


            <!-- Indicador de progreso -->
            <div id="progreso">

                <div class="circulo"></div>

                <!-- Segundo círculo activo -->
                <div class="circulo activo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

            </div>


            <!-- Pantalla siguiente -->
            <div
                class="flecha"
                onclick="window.location.href='cuadrados3.html'"
            >
                ›
            </div>

        </div>

    </main>


    <!-- JavaScript del juego -->
    <script src="cuadrados2.js"></script>

</body>

</html>
