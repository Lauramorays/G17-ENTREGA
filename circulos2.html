
<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">

    <!-- Hace que la experiencia se adapte a celular/tablet/PC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Empatía</title>

    <style>

        /* ----------------------------------------------------
           CONFIGURACIÓN GENERAL
           ---------------------------------------------------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 80%;
        }


        /* Fondo exterior de la experiencia */
        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* ----------------------------------------------------
           CONTENEDOR PRINCIPAL
           ---------------------------------------------------- */

        #juego {

            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto 0 auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* ----------------------------------------------------
           CANVAS
           ---------------------------------------------------- */

        #canvas {

            width: 100%;
            height: 100%;

            display: block;

            /* Evita que el navegador interprete
               el toque como scroll o zoom */

            touch-action: none;

            cursor: pointer;
        }


        /* ----------------------------------------------------
           NAVEGACIÓN SUPERIOR
           ---------------------------------------------------- */

        #navegacion {

            position: absolute;

            top: 18px;

            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 20;

            pointer-events: none;
        }


        /* Flechas laterales */

        .flecha {

            color: #C4CEE5;

            font-size: 38px;

            font-weight: 200;

            line-height: 1;

            cursor: pointer;

            pointer-events: auto;

            user-select: none;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        .flecha:hover {

            opacity: 0.7;

            transform: scale(1.1);
        }


        /* ----------------------------------------------------
           CÍRCULOS DE PROGRESO
           ---------------------------------------------------- */

        #progreso {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;
        }


        .circulo {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            opacity: 0.45;
        }


        /* Empatía es la quinta experiencia */

        .circulo.activo {

            background: #C4CEE5;

            opacity: 1;
        }

    </style>

</head>


<body>

    <!-- Contenedor de toda la experiencia -->

    <main id="juego">


        <!-- Canvas donde se dibujan los organismos -->

        <canvas id="canvas"></canvas>


        <!-- Navegación superior -->

        <div id="navegacion">


            <!-- Volver a IDENTIDAD -->

            <div
                class="flecha"
                onclick="window.location.href='circulos.html'"
            >
                ‹
            </div>


            <!-- 9 experiencias -->

            <div id="progreso">

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <!-- EMPATÍA -->
                <div class="circulo activo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

                <div class="circulo"></div>

            </div>


            <!-- Continuar a COLABORACIÓN -->

            <div
                class="flecha"
                onclick="window.location.href='circulos3.html'"
            >
                ›
            </div>

        </div>

    </main>


    <!-- Código de la experiencia -->

    <script src="circulos2.js"></script>

</body>

</html>
