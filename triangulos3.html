
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expectativa</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;
            background: #060C1A;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }


        /* ============================================================
           NAVEGACIÓN
           ============================================================ */

        #navegacion {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            pointer-events: none;
        }

        #progreso {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #progreso span {
            display: block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid #C4CEE5;
            background: transparent;
            opacity: 0.45;
        }

        /* 9. EXPECTATIVA */
        #progreso span.activo {
            background: #C4CEE5;
            opacity: 1;
        }

        #navegacion button {
            border: none;
            background: transparent;
            color: #C4CEE5;
            font-size: 32px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            position: relative;
            z-index: 1001;
            user-select: none;
        }

        #navegacion button:hover {
            opacity: 0.6;
        }

        #navegacion button:active {
            opacity: 0.4;
        }

    </style>

</head>


<body>

    <main id="juego">


        <!-- ============================================================
             NAVEGACIÓN
             ============================================================ -->

        <div id="navegacion">


            <!-- Volver a DESPRENDIMIENTO -->
            <button
                type="button"
                onclick="window.location.href='triangulos2.html'"
                aria-label="Volver a Desprendimiento"
            >
                ‹
            </button>


            <!-- ========================================================
                 PROGRESO DE LAS 9 EXPERIENCIAS
                 ======================================================== -->

            <div id="progreso">

                <!-- 1. MEMORIA -->
                <span></span>

                <!-- 2. HERENCIA -->
                <span></span>

                <!-- 3. CADUCIDAD -->
                <span></span>

                <!-- 4. IDENTIDAD -->
                <span></span>

                <!-- 5. EMPATÍA -->
                <span></span>

                <!-- 6. COLABORACIÓN -->
                <span></span>

                <!-- 7. INCERTIDUMBRE -->
                <span></span>

                <!-- 8. DESPRENDIMIENTO -->
                <span></span>

                <!-- 9. EXPECTATIVA -->
                <span class="activo"></span>

            </div>


            <!-- Volver al INICIO -->
            <button
                type="button"
                onclick="window.location.href='index.html'"
                aria-label="Volver al inicio"
            >
                ›
            </button>

        </div>


        <!-- ============================================================
             ÁREA DEL JUEGO
             ============================================================ -->

        <canvas id="canvas"></canvas>


    </main>


    <!-- ================================================================
         JAVASCRIPT
         ================================================================ -->

    <script src="triangulos3.js"></script>

</body>

</html>
