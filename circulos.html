<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;
        }


        /* =========================
           NAVEGACIÓN
        ========================= */

        #navegacion {

            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;

            gap: 15px;

            z-index: 1000;
        }


        /* =========================
           CÍRCULOS DE PROGRESO
        ========================= */

        #progreso {

            display: flex;
            align-items: center;

            gap: 7px;
        }


        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* CUARTO CÍRCULO ACTIVO */

        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =========================
           FLECHAS
        ========================= */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 32px;

            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 1001;
        }


        #navegacion button:hover {

            opacity: 0.6;
        }


        /* =========================
           MENSAJE
        ========================= */

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }

    </style>

</head>


<body>


    <main id="juego">


        <!-- =========================
             NAVEGACIÓN
        ========================= -->

        <div id="navegacion">


            <!-- VOLVER A CADUCIDAD -->

            <button
                type="button"
                onclick="window.location.href='cuadrados3.html'">

                ‹

            </button>


            <!-- =========================
                 PROGRESO
            ========================= -->

            <div id="progreso">

                <!-- 1 MEMORIA -->
                <span></span>

                <!-- 2 HERENCIA -->
                <span></span>

                <!-- 3 CADUCIDAD -->
                <span></span>

                <!-- 4 IDENTIDAD -->
                <span class="activo"></span>

                <!-- 5 EMPATÍA -->
                <span></span>

                <!-- 6 COLABORACIÓN -->
                <span></span>

                <!-- 7 INCERTIDUMBRE -->
                <span></span>

                <!-- 8 DESPRENDIMIENTO -->
                <span></span>

                <!-- 9 EXPECTATIVA -->
                <span></span>

            </div>


            <!-- AVANZAR A EMPATÍA -->

            <button
                type="button"
                onclick="window.location.href='circulos2.html'">

                ›

            </button>


        </div>


        <!-- =========================
             JUEGO
        ========================= -->

        <canvas id="canvas"></canvas>


   

    </main>


    <!-- =========================
         JAVASCRIPT DEL JUEGO
    ========================= -->

    <script src="circulos.js"></script>


</body>

</html>
