
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidad</title>
    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
           Elimina márgenes y rellenos predeterminados.
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           CUERPO DE LA PÁGINA
        ===================================================== */

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL DEL JUEGO
        ===================================================== */

        #juego {
            width: 95vw;
            height: 95vh;

            /* Centra el juego y deja un pequeño margen */
            margin: 2.5vh auto;

            /* Fondo azul muy oscuro */
            background: #060C1A;

            position: relative;
            overflow: hidden;
        }


        /* =====================================================
           CANVAS
           Acá se dibujan y mueven los círculos.
        ===================================================== */

        canvas {
            display: block;

            width: 100%;
            height: 100%;

            /* Permite controlar el tacto desde JavaScript */
            touch-action: none;
        }


        /* =====================================================
           NAVEGACIÓN
        ===================================================== */

        #navegacion {

            /* Se coloca encima del canvas */
            position: absolute;

            top: 18px;
            left: 50%;

            /* Centra horizontalmente */
            transform: translateX(-50%);

            width: 94%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            /* La navegación queda por encima del juego */
            z-index: 20;

            /*
             * El contenedor no bloquea el canvas.
             * Los botones recuperan los eventos con
             * pointer-events: auto más abajo.
             */
            pointer-events: none;
        }


        /* =====================================================
           CÍRCULOS DE PROGRESO
        ===================================================== */

        #progreso {

            display: flex;
            align-items: center;

            /* Espacio entre los 9 círculos */
            gap: 7px;
        }


        /* Cada círculo del progreso */

        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            /* Los hace perfectamente circulares */
            border-radius: 50%;

            /* Borde de navegación */
            border: 1px solid #C4CEE5;

            /* Por defecto están vacíos */
            background: transparent;

            /* Los que no están activos tienen menor intensidad */
            opacity: 0.45;
        }


        /* =====================================================
           CÍRCULO ACTIVO
           IDENTIDAD = CÍRCULO NÚMERO 4
        ===================================================== */

        #progreso span.activo {

            /* Se rellena el círculo activo */
            background: #C4CEE5;

            /* Se muestra completamente */
            opacity: 1;
        }


        /* =====================================================
           FLECHAS DE NAVEGACIÓN
        ===================================================== */

        #navegacion button {

            /* Quitamos el estilo predeterminado del botón */
            border: none;
            background: transparent;

            /* Color de las flechas */
            color: #C4CEE5;

            /* Tamaño de las flechas */
            font-size: 32px;

            /* Cambia el cursor al pasar encima */
            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            /*
             * IMPORTANTE:
             * Aunque el contenedor tiene pointer-events:none,
             * los botones sí reciben los clics.
             */
            pointer-events: auto;

            /*
             * Los coloca por encima del canvas.
             */
            position: relative;
            z-index: 1001;
        }


        /* Efecto visual al pasar el mouse */

        #navegacion button:hover {
            opacity: 0.6;
        }


        /* Efecto al presionar */

        #navegacion button:active {
            opacity: 0.4;
        }


        /* =====================================================
           MENSAJE
           Actualmente no contiene texto, pero queda preparado
           por si después queremos agregar una indicación.
        ===================================================== */

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            /* El mensaje no interfiere con el juego */
            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         CONTENEDOR PRINCIPAL
    ===================================================== -->

    <main id="juego">


        <!-- =================================================
             NAVEGACIÓN SUPERIOR
        ================================================= -->

        <div id="navegacion">


            <!-- =============================================
                 FLECHA IZQUIERDA
                 Vuelve a CADUCIDAD
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='cuadrados3.html'"
                aria-label="Volver a Caducidad">

                ‹

            </button>


            <!-- =============================================
                 INDICADOR DE PROGRESO
                 Hay 9 experiencias en total.
            ============================================== -->

            <div id="progreso">

                <!-- 1 - MEMORIA -->
                <span></span>

                <!-- 2 - HERENCIA -->
                <span></span>

                <!-- 3 - CADUCIDAD -->
                <span></span>

                <!-- 4 - IDENTIDAD: ACTIVO -->
                <span class="activo"></span>

                <!-- 5 - EMPATÍA -->
                <span></span>

                <!-- 6 - COLABORACIÓN -->
                <span></span>

                <!-- 7 - INCERTIDUMBRE -->
                <span></span>

                <!-- 8 - DESPRENDIMIENTO -->
                <span></span>

                <!-- 9 - EXPECTATIVA -->
                <span></span>

            </div>


            <!-- =============================================
                 FLECHA DERECHA
                 Avanza a EMPATÍA
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='circulos2.html'"
                aria-label="Avanzar a Empatía">

                ›

            </button>


        </div>


        <!-- =================================================
             CANVAS
             Acá circulos.js dibuja el juego de IDENTIDAD.
        ================================================== -->

        <canvas id="canvas"></canvas>


        <!-- =================================================
             MENSAJE
        ================================================== -->

        <div id="mensaje"></div>


    </main>


    <!-- =====================================================
         JAVASCRIPT DEL JUEGO
         Se mantiene circulos.js como en tu código original.
    ===================================================== -->

    <script src="circulos.js"></script>


</body>

</html>
