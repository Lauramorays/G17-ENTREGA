<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<title>Ansiedad</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;
            background: #060C1A;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Coloca las flechas en los extremos y los puntos en el centro. */
        #navegacion {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            pointer-events: none;
        }

        /* Mantiene los 9 puntos juntos y centrados. */
        #progreso {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
        }

        /* Estilo de los puntos de progreso. */
        #progreso span {
            display: block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid #C4CEE5;
            background: transparent;
            opacity: 0.45;
        }

        /* Octavo punto: Desprendimiento. */
        #progreso span.activo {
            background: #C4CEE5;
            opacity: 1;
        }

        /* Estilo de las flechas de navegación. */
        #navegacion button {
            border: none;
            background: transparent;
            color: #C4CEE5;
            font-size: 38px;
            font-weight: 200;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1001;
            pointer-events: auto;
            user-select: none;
            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        /* Pequeña reacción visual al pasar el mouse. */
        #navegacion button:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

    </style>

</head>


<body>

    <main id="juego">

        <!-- Navegación entre las experiencias. -->
        <div id="navegacion">

            <!-- Volver a Incertidumbre. -->
            <button
                type="button"
                onclick="window.location.href='triangulos.html'"
                aria-label="Volver"
            >
                ‹
            </button>


            <!-- Progreso de las 9 experiencias. -->
            <div id="progreso">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

                <!-- 8. DESPRENDIMIENTO -->
                <span class="activo"></span>

                <span></span>

            </div>


            <!-- Avanzar a Expectativa. -->
            <button
                type="button"
                onclick="window.location.href='triangulos3.html'"
                aria-label="Avanzar"
            >
                ›
            </button>

        </div>


        <!-- Área donde funciona el juego. -->
        <canvas id="canvas"></canvas>

    </main>


    <script src="triangulos2.js"></script>

</body>

</html>
