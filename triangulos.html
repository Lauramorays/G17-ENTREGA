
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Incertidumbre</title>


    <style>


        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           HTML Y BODY
        ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           CUERPO
        ===================================================== */

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           ÁREA PRINCIPAL DEL JUEGO
           IGUAL A HERENCIA Y CADUCIDAD
        ===================================================== */

        #juego {

            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        #canvas {

            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;

            cursor: pointer;
        }


        /* =====================================================
           NAVEGACIÓN
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #navegacion {

            position: absolute;

            top: 18px;

            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 1000;

            pointer-events: none;
        }


        /* =====================================================
           PROGRESO
        ===================================================== */

        #progreso {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        /* =====================================================
           CÍRCULOS
        ===================================================== */

        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* =====================================================
           CÍRCULO ACTIVO
           INCERTIDUMBRE = CÍRCULO 7
        ===================================================== */

        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =====================================================
           FLECHAS
        ===================================================== */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 32px;

            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            pointer-events: auto;

            position: relative;

            z-index: 1001;
        }


        /* =====================================================
           EFECTO AL PASAR EL MOUSE
        ===================================================== */

        #navegacion button:hover {

            opacity: 0.6;
        }


        /* =====================================================
           EFECTO AL PRESIONAR
        ===================================================== */

        #navegacion button:active {

            opacity: 0.4;
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        #titulo {

            position: absolute;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 18px;

            letter-spacing: 5px;

            opacity: 0.8;

            pointer-events: none;

            z-index: 10;
        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }


    </style>

</head>


<body>


    <main id="juego">


        <!-- =================================================
             NAVEGACIÓN SUPERIOR
        ================================================== -->

        <div id="navegacion">


            <!-- =============================================
                 FLECHA IZQUIERDA
                 Vuelve a COLABORACIÓN
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='circulos3.html'"
                aria-label="Volver a Colaboración"
            >

                ‹

            </button>


            <!-- =============================================
                 PROGRESO
                 9 EXPERIENCIAS
            ============================================== -->

            <div id="progreso">


                <!-- 1 - MEMORIA -->
                <span></span>


                <!-- 2 - HERENCIA -->
                <span></span>


                <!-- 3 - CADUCIDAD -->
                <span></span>


                <!-- 4 - IDENTIDAD -->
                <span></span>


                <!-- 5 - EMPATÍA -->
                <span></span>


                <!-- 6 - COLABORACIÓN -->
                <span></span>


                <!-- 7 - INCERTIDUMBRE -->
                <span class="activo"></span>


                <!-- 8 - DESPRENDIMIENTO -->
                <span></span>


                <!-- 9 - EXPECTATIVA -->
                <span></span>


            </div>


            <!-- =============================================
                 FLECHA DERECHA
                 Avanza a DESPRENDIMIENTO
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='triangulos2.html'"
                aria-label="Avanzar a Desprendimiento"
            >

                ›

            </button>


        </div>


        <!-- =================================================
             CANVAS DEL JUEGO
        ================================================== -->

        <canvas id="canvas"></canvas>


        <!-- =================================================
             TÍTULO
        ================================================== -->

        <div id="titulo"></div>


        <!-- =================================================
             MENSAJE
        ================================================== -->

        <div id="mensaje"></div>


    </main>


    <!-- =====================================================
         JAVASCRIPT DE INCERTIDUMBRE
    ===================================================== -->

    <script src="triangulos.js"></script>


</body>

</html>
