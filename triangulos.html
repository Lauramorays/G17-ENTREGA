
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Incertidumbre</title>


    <style>

        /* Configuración general */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* Fondo exterior */
        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* Área principal del juego */
        #juego {
            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto 0 auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* Canvas donde funciona el juego */
        #canvas {
            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;

            cursor: pointer;
        }


        /* =========================
           NAVEGACIÓN
        ========================= */

        #navegacion {

            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            /* La navegación ocupa casi todo el ancho */
            width: 94%;

            display: flex;

            align-items: center;

            /* Coloca las flechas en los extremos */
            justify-content: space-between;

            z-index: 1000;

            /* Solo las flechas reciben los clics */
            pointer-events: none;
        }


        /* =========================
           FLECHAS
        ========================= */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 38px;

            font-weight: 200;

            line-height: 1;

            cursor: pointer;

            padding: 0;

            width: auto;
            height: auto;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 1001;

            /* Permite hacer clic en las flechas */
            pointer-events: auto;

            user-select: none;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* Efecto al pasar el mouse */
        #navegacion button:hover {

            opacity: 0.7;

            transform: scale(1.1);
        }


        /* =========================
           PROGRESO
        ========================= */

        #progreso {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;
        }


        /* Cada punto del progreso */
        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* Séptimo punto: pantalla actual */
        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =========================
           TÍTULO
        ========================= */

        #titulo {

            position: absolute;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 18px;

            letter-spacing: 5px;

            opacity: 0.8;

            pointer-events: none;

            z-index: 10;
        }


        /* =========================
           MENSAJE
        ========================= */

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }


    </style>

</head>


<body>


    <main id="juego">


        <!-- Navegación superior -->
        <div id="navegacion">


            <!-- Volver a Colaboración -->
            <button
                type="button"
                onclick="window.location.href='circulos3.html'"
                aria-label="Volver a Colaboración"
            >
                ‹
            </button>


            <!-- 9 puntos de progreso -->
            <div id="progreso">

                <!-- 1. MEMORIA -->
                <span></span>

                <!-- 2. HERENCIA -->
                <span></span>

                <!-- 3. CADUCIDAD -->
                <span></span>

                <!-- 4. IDENTIDAD -->
                <span></span>

                <!-- 5. EMPATÍA -->
                <span></span>

                <!-- 6. COLABORACIÓN -->
                <span></span>

                <!-- 7. INCERTIDUMBRE -->
                <span class="activo"></span>

                <!-- 8. DESPRENDIMIENTO -->
                <span></span>

                <!-- 9. EXPECTATIVA -->
                <span></span>

            </div>


            <!-- Avanzar a Desprendimiento -->
            <button
                type="button"
                onclick="window.location.href='triangulos2.html'"
                aria-label="Avanzar a Desprendimiento"
            >
                ›
            </button>


        </div>


        <!-- Canvas del juego -->
        <canvas id="canvas"></canvas>


        <!-- Título -->
        <div id="titulo"></div>


        <!-- Mensaje -->
        <div id="mensaje"></div>


    </main>


    <!-- JavaScript del juego -->
    <script src="triangulos.js"></script>


</body>

</html>
