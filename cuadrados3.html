
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caducidad</title>


    <style>


        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           HTML Y BODY
        ===================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           CUERPO
        ===================================================== */

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           ÁREA PRINCIPAL DEL JUEGO
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #juego {

            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        #canvas {

            width: 100%;
            height: 100%;

            display: block;

            touch-action: none;

            cursor: pointer;
        }


        /* =====================================================
           NAVEGACIÓN
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #navegacion {

            position: absolute;

            top: 18px;

            left: 50%;

            transform: translateX(-50%);

            width: 94%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 1000;

            pointer-events: none;
        }


        /* =====================================================
           PROGRESO
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #progreso {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        /* =====================================================
           CÍRCULOS
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* =====================================================
           CÍRCULO ACTIVO
           CADUCIDAD = CÍRCULO 3
        ===================================================== */

        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =====================================================
           FLECHAS
           EXACTAMENTE IGUAL A HERENCIA
        ===================================================== */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 32px;

            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            pointer-events: auto;

            position: relative;

            z-index: 1001;
        }


        /* =====================================================
           EFECTO AL PASAR EL MOUSE
           IGUAL A HERENCIA
        ===================================================== */

        #navegacion button:hover {

            opacity: 0.6;
        }


        /* =====================================================
           EFECTO AL PRESIONAR
           IGUAL A HERENCIA
        ===================================================== */

        #navegacion button:active {

            opacity: 0.4;
        }


    </style>

</head>


<body>


    <!-- =====================================================
         ÁREA PRINCIPAL
    ===================================================== -->

    <main id="juego">


        <!-- =================================================
             NAVEGACIÓN
             EXACTAMENTE IGUAL A HERENCIA
        ================================================== -->

        <div id="navegacion">


            <!-- =============================================
                 FLECHA IZQUIERDA
                 Vuelve a HERENCIA
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='cuadrados2.html'"
                aria-label="Volver a Herencia">

                ‹

            </button>


            <!-- =============================================
                 PROGRESO
                 9 EXPERIENCIAS
            ============================================== -->

            <div id="progreso">


                <!-- 1 - MEMORIA -->
                <span></span>


                <!-- 2 - HERENCIA -->
                <span></span>


                <!-- 3 - CADUCIDAD -->
                <span class="activo"></span>


                <!-- 4 - IDENTIDAD -->
                <span></span>


                <!-- 5 - EMPATÍA -->
                <span></span>


                <!-- 6 - COLABORACIÓN -->
                <span></span>


                <!-- 7 - INCERTIDUMBRE -->
                <span></span>


                <!-- 8 - DESPRENDIMIENTO -->
                <span></span>


                <!-- 9 - EXPECTATIVA -->
                <span></span>


            </div>


            <!-- =============================================
                 FLECHA DERECHA
                 Avanza a IDENTIDAD
            ============================================== -->

            <button
                type="button"
                onclick="window.location.href='circulos.html'"
                aria-label="Avanzar a Identidad">

                ›

            </button>


        </div>


        <!-- =================================================
             CANVAS DE CADUCIDAD
        ================================================== -->

        <canvas id="canvas"></canvas>


    </main>


    <!-- =====================================================
         JAVASCRIPT DE CADUCIDAD
         NO SE MODIFICA
    ===================================================== -->

    <script src="cuadrados3.js"></script>


</body>

</html>
