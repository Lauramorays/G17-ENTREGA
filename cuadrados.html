<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memoria</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;
            overflow: hidden;
        }

        #contenedor {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: grid;

            justify-content: center;
            align-content: center;

            gap: 60px;

            pointer-events: none;
        }

        .cuadrado {

            position: absolute;

            width: 120px;
            height: 120px;

            background: var(--color);

            border: none;
            outline: none;

            cursor: pointer;

            pointer-events: auto;

            transform-origin: center center;

            transition:
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .cuadrado.activo {

            filter: brightness(7.9);

            box-shadow:
                0 0 35px var(--color),
                0 0 70px var(--color),
                0 0 120px var(--color);
        }


        /* =========================
           NAVEGACIÓN
        ========================= */

        #navegacion {

            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;

            gap: 15px;

            z-index: 1000;
        }


        #progreso {

            display: flex;
            align-items: center;

            gap: 7px;
        }


        #progreso span {

            display: block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #C4CEE5;

            background: transparent;

            opacity: 0.45;
        }


        /* PRIMER CÍRCULO ACTIVO */

        #progreso span.activo {

            background: #C4CEE5;

            opacity: 1;
        }


        /* =========================
           FLECHAS
        ========================= */

        #navegacion button {

            border: none;

            background: transparent;

            color: #C4CEE5;

            font-size: 32px;

            cursor: pointer;

            padding: 0;

            width: 30px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 1001;
        }


        #navegacion button:hover {

            opacity: 0.6;
        }


        /* =========================
           TÍTULO
        ========================= */

        #titulo {

            position: absolute;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 18px;

            letter-spacing: 5px;

            opacity: 0.8;

            pointer-events: none;

            z-index: 10;
        }


        /* =========================
           MENSAJE
        ========================= */

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }

    </style>

</head>


<body>


    <main id="juego">


        <!-- =========================
             NAVEGACIÓN
        ========================= -->

        <div id="navegacion">


            <!-- VOLVER AL INICIO -->

            <button
                type="button"
                onclick="window.location.href='index.html'">

                ‹

            </button>


            <!-- =========================
                 9 CÍRCULOS
            ========================= -->

            <div id="progreso">

                <!-- 1 MEMORIA -->
                <span class="activo"></span>

                <!-- 2 HERENCIA -->
                <span></span>

                <!-- 3 CADUCIDAD -->
                <span></span>

                <!-- 4 IDENTIDAD -->
                <span></span>

                <!-- 5 EMPATÍA -->
                <span></span>

                <!-- 6 COLABORACIÓN -->
                <span></span>

                <!-- 7 INCERTIDUMBRE -->
                <span></span>

                <!-- 8 DESPRENDIMIENTO -->
                <span></span>

                <!-- 9 EXPECTATIVA -->
                <span></span>

            </div>


            <!-- AVANZAR A HERENCIA -->

            <button
                type="button"
                onclick="window.location.href='cuadrados2.html'">

                ›

            </button>


        </div>


        <!-- =========================
             JUEGO
        ========================= -->

        <div id="contenedor"></div>


        

    </main>


    <!-- =========================
         JAVASCRIPT DEL JUEGO
    ========================= -->

    <script src="cuadrados.js"></script>


</body>

</html>
