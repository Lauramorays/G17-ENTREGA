
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego de Memoria</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;

            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;

            overflow: hidden;
        }

        /* CONTENEDOR DE LOS CUADRADOS */

        #contenedor {
            position: absolute;

            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns: repeat(4, 120px);

            grid-auto-rows: 120px;

            justify-content: center;

            align-content: center;

            gap: 35px;
        }

        /* CUADRADOS */

        .cuadrado {
            width: 120px;
            height: 120px;

            border: 5px solid;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .cuadrado.activo {
            transform: scale(1.12);

            background: var(--color);

            box-shadow:
                0 0 20px var(--color),
                0 0 40px var(--color);
        }

        /* MENSAJE */

        #mensaje {
            position: absolute;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.8;

            z-index: 10;
        }

    </style>

</head>

<body>

    <main id="juego">

        <div id="contenedor"></div>

        <div id="mensaje">
            PREPARATE
        </div>

    </main>

    <script src="cuadrados.js"></script>

</body>

</html>
