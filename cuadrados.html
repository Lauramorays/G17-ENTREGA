<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memoria</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #D9D9D9;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 95vw;
            height: 95vh;
            margin: 2.5vh auto;

            background: #060C1A;

            position: relative;
            overflow: hidden;
        }

        #contenedor {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: grid;

            justify-content: center;
            align-content: center;

            gap: 60px;

            pointer-events: none;
        }

        .cuadrado {

            position: absolute;

            width: 120px;
            height: 120px;

            background: var(--color);

            border: none;
            outline: none;

            cursor: pointer;

            pointer-events: auto;

            transform-origin: center center;

            transition:
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .cuadrado.activo {

            filter: brightness(7.9);

    box-shadow:
        0 0 35px var(--color),
        0 0 70px var(--color),
        0 0 120px var(--color);
        }

        #titulo {

            position: absolute;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 18px;

            letter-spacing: 5px;

            opacity: 0.8;

            pointer-events: none;

            z-index: 10;
        }

        #mensaje {

            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: white;

            font-size: 14px;

            letter-spacing: 3px;

            opacity: 0.7;

            pointer-events: none;

            text-align: center;

            white-space: nowrap;

            z-index: 10;
        }

    </style>

</head>

<body>

    <main id="juego">

        <div id="contenedor"></div>

        <div id="titulo">
            MEMORIA
        </div>

        <div id="mensaje">
            MIRÁ LA SECUENCIA
        </div>

    </main>

    <script src="cuadrados.js"></script>

</body>

</html>
